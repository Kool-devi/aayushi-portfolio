if;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:4px 32px"><span>DarkRoast</span><span>Client dashboard redesign</span><span>2026</span></span> <h1 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:64px;line-height:.98">Helping brands on DarkRoast manage <span style="font-style:italic">five projects at once</span> instead of one</h1> </div> <div style="position:relative;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding-top:12px;border-top:1px solid #0B0B0B;font-size:13px"> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding-top:2px">Role</span><span>Product Designer, working with DarkRoast as a studio client</span> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding-top:2px">Team</span><span>Me and a PM from my studio, with DarkRoast’s owner and developer</span> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding-top:2px">Timeline</span><span>6 months, December 2025 to May 2026</span> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding-top:2px">Research</span><span>Survey of 150 brands, and usage tracking of our regular brands</span> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding-top:2px">Status</span><span>Shipped, and tested with real brands before launch</span> </div> </div> <div style="position:relative;height:560px;margin:0 -40px;background:#E9DA2E;overflow:hidden"> <img src="Mockups/DarkRoast/Banner.webp" alt="DarkRoast Projects page showing every project&#x27;s status and priority in one list" style="width:100%;height:100%;object-fit:cover;display:block"/> <span style="position:absolute;left:40px;bottom:20px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;font-weight:500">Fig. 01 — The new Projects page, where a brand can see every project’s status in one list</span> </div> </header> <nav data-sticky="true" style="position:sticky;top:66px;z-index:5;background:#EFEFEC;border-bottom:1px solid #0B0B0B1F;padding:0 40px"> <div style="display:flex;align-items:center;gap:6px;height:64px;overflow:hidden"> <!-- --> <a class="dh7" href="#tldr" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#FFFFFF;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">00</span>TL;DR</a> <!-- --> <a class="dh7" href="#proto" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">01</span>Prototype</a> <!-- --> <a class="dh7" href="#problem" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">02</span>Problem</a> <!-- --> <a class="dh7" href="#research" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">03</span>Research</a> <!-- --> <a class="dh7" href="#workflow" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">04</span>Workflow</a> <!-- --> <a class="dh7" href="#model" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">05</span>Mental model</a> <!-- --> <a class="dh7" href="#iter" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">06</span>Iterations</a> <!-- --> <a class="dh7" href="#final" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">07</span>Final design</a> <!-- --> <a class="dh7" href="#outcome" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">08</span>Outcome</a> <!-- --> <a class="dh7" href="#reflect" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">09</span>Reflection</a> <!-- --> </div> </nav> <section id="tldr" style="padding:48px 40px 48px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"> <div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">00</span><span>TL;DR · In one minute</span></div> <div style="display:flex;flex-direction:column;gap:36px"> <p style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:36px;line-height:1.12">DarkRoast is a platform where design teams and the brands that hire them manage projects together. Brands kept adding more projects, but the dashboard was still built for one project at a time, so they had to <span style="font-style:italic">check each one separately.</span></p> <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:12px"> <div style="padding:22px 24px 24px;border-radius:20px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">What I found</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:27px;line-height:1.05">Brands didn’t need <span style="font-style:italic">more features</span></span><span style="font-size:14.5px;line-height:1.55;color:#3C3C38">The survey and usage tracking both showed brands opening every project just to see its status.</span></div> <div style="padding:22px 24px 24px;border-radius:20px;background:#0B0B0B;color:#FFFFFF;display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">What I did</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:27px;line-height:1.05">Fixed the list, <span style="font-style:italic">not the whole product</span></span><span style="font-size:14.5px;line-height:1.55;color:#FFFFFFb3">I kept the layout brands already knew and changed what shows on the Projects page and inside a project.</span></div> <div style="padding:22px 24px 24px;border-radius:20px;background:#FCEB3F;display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase">The result</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:27px;line-height:1.05">Status visible <span style="font-style:italic">from the list</span></span><span style="font-size:14.5px;line-height:1.55">In testing, brands could see where each project stood without opening it and started handling several at once.</span></div> </div> </div> </section> <section id="proto" style="margin:0 40px;padding:20px;border-radius:28px;background:#0B0B0B;color:#FFFFFF;display:grid;grid-template-columns:minmax(0,1fr) 816px;gap:40px;align-items:stretch"><div style="display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:20px 0 8px 20px"><div style="display:flex;flex-direction:column;gap:18px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FFFFFF;display:flex;align-items:baseline;gap:14px"><span style="color:#FCEB3F">01</span><span>Watch it</span></span><h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:40px;line-height:1.02">See how a brand moves through the <span style="font-style:italic">new Projects page</span></h2><span style="font-size:13.5px;line-height:1.55;color:#FFFFFFb3;max-width:34ch">This walkthrough plays on its own. I built it for this portfolio from my final Figma screens using Claude and the Figma MCP server. The live product was built by DarkRoast’s developer.</span></div><div style="display:flex;flex-direction:column;align-items:flex-start;gap:16px"><span style="display:flex;align-items:center;gap:8px;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FFFFFF99"><span style="width:6px;height:6px;border-radius:50%;background:#2DB34A"></span>Autoplay · best viewed on desktop</span><a href="DarkRoast%20Prototype%20Autoplay.html" target="_blank" style="height:44px;padding:0 8px 0 18px;border-radius:999px;background:#FCEB3F;color:#0B0B0B;text-decoration:none;display:flex;align-items:center;gap:14px;font-size:13.5px;font-weight:500">Open full screen <span style="width:30px;height:30px;border-radius:50%;background:#0B0B0B;color:#FCEB3F;display:grid;place-items:center"><svg width="12" height="12" viewBox="0 0 100 100" style="display:block"><path d="M14 14 L84 84 M84 34 L84 84 L34 84" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square"></path></svg></span></a></div></div><div style="align-self:center"><div style="height:32px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#232321;border-radius:14px 14px 0 0"><span style="width:10px;height:10px;border-radius:50%;background:#4A4A46"></span><span style="width:10px;height:10px;border-radius:50%;background:#4A4A46"></span><span style="width:10px;height:10px;border-radius:50%;background:#4A4A46"></span><span style="margin-left:14px;font-size:11.5px;color:#FFFFFF80">darkroast.app/projects</span></div><div style="position:relative;width:816px;height:510px;overflow:hidden;background:#0F3826"><iframe src="DarkRoast%20Prototype%20Autoplay.html" title="DarkRoast autoplay walkthrough" loading="lazy" style="position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;transform:scale(.566667)"></iframe><span aria-hidden="true" style="position:absolute;left:0;bottom:0;width:14px;height:14px;background:radial-gradient(circle at 100% 0, transparent 13.5px, #0B0B0B 14px);pointer-events:none"></span><span aria-hidden="true" style="position:absolute;right:0;bottom:0;width:14px;height:14px;background:radial-gradient(circle at 0 0, transparent 13.5px, #0B0B0B 14px);pointer-events:none"></span></div></div></section> <section id="problem" style="margin-top:96px;position:relative;height:700px"><div style="position:sticky;top:0;height:700px;overflow:hidden"><div data-pinbody="true" style="position:relative;height:560px;box-sizing:border-box;padding:16px 0 16px;display:flex;flex-direction:column;gap:0px"><div style="position:absolute;left:0;top:0;bottom:0;width:369.5px;z-index:1;background:linear-gradient(90deg, #EFEFEC calc(100% - 28px), rgba(239,239,236,0));pointer-events:none"><div style="pointer-events:auto;height:100%;box-sizing:border-box;padding:16px 0 16px"><div style="display:flex;flex-direction:column;gap:28px;padding:0 28px 0 40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">02</span><span>The problem</span></div><h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:38px;line-height:1.04">Brands couldn’t tell which project <span style="font-style:italic">needed them first</span></h2></div></div></div><div style="fle ding:22px;border-radius:18px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px"><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:25px;line-height:1.1">Files in one place</span><span style="font-size:14px;line-height:1.5;color:#3C3C38">Images, videos and PDFs showed up together, with previews.</span></div> </div> <p style="margin:0;font-size:17px;line-height:1.55;max-width:56ch">DarkRoast’s developer <strong style="font-weight:600">shipped the redesign</strong> after we tested it with real brands.</p> </div> </div> </section> <section id="reflect" style="padding:110px 40px 100px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"> <div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">09</span><span>Reflection</span></div> <div style="display:flex;flex-direction:column;gap:40px"> <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px"> <div style="display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">What it pushed me toward</span><span style="font-size:20px;line-height:1.4;letter-spacing:-.02em">Thinking beyond screens, about <strong style="font-weight:600">workflow, information architecture and product behavior.</strong></span></div> <div style="display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">The biggest lesson</span><span style="font-size:20px;line-height:1.4;letter-spacing:-.02em">DarkRoast’s brands were mostly middle-aged and used to the old dashboard. The right answer was <strong style="font-weight:600">a clear step up from what they knew,</strong> not a new tool they’d have to learn again.</span></div> </div> <blockquote style="margin:0;padding:36px 0 0;border-top:1px solid #0B0B0B;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:54px;line-height:1.02">“A brand should know what needs them <span style="font-style:italic">the moment they log in.</span>”</blockquote><div style="display:flex;flex-direction:row;align-items:baseline;gap:24px;padding:18px 22px;border-radius:16px;background:#FFFFFF"><span style="flex:none;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">What’s next</span><span style="font-size:16px;line-height:1.5;color:#3C3C38">DarkRoast is taking these changes to the designer side and to mobile in phase 2.</span></div> </div> </section> <footer style="background:#0B0B0B;color:#FFFFFF;padding:56px 40px 28px;display:flex;flex-direction:column;gap:48px"> <div style="display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:40px;align-items:end"> <div style="display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">Curious to know more?</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:44px;line-height:1.05">This is a small part of the process. <span style="font-style:italic">Let’s walk through the rest.</span></span></div> <div style="display:flex;gap:10px;justify-content:flex-end"> <a href="mailto:aayushipatel2002@gmail.com?subject=DarkRoast%20case%20study" style="height:56px;padding:0 10px 0 24px;border-radius:999px;background:#FCEB3F;color:#0B0B0B;text-decoration:none;display:flex;align-items:center;gap:18px;font-size:15px
