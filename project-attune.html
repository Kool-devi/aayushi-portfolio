splay:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">08</span><span>Handoff</span></div><div style="display:flex;flex-direction:column;gap:28px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:48px;line-height:1.02">A new developer team joined halfway through, <span style="font-style:italic">so I made the design easy to pick up.</span></h2> <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px"> <div style="padding:22px;border-radius:20px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">01 · The situation</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.06em;font-size:44px;line-height:.9">169 screens</span><span style="font-size:14.5px;line-height:1.45;color:#3C3C38">Handed to a brand new team on a shorter timeline.</span></div> <div style="padding:22px;border-radius:20px;background:#0B0B0B;color:#FFFFFF;display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">02 · What I did</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.06em;font-size:44px;line-height:.9">Found the repeats</span><span style="font-size:14.5px;line-height:1.45;color:#FFFFFFb3">I went through every screen and turned repeated UI into reusable components.</span></div> <div style="padding:22px;border-radius:20px;background:#FCEB3F;display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase">03 · The result</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.06em;font-size:44px;line-height:.9">One shared library</span><span style="font-size:14.5px;line-height:1.45">Developers build each element once, and it looks the same everywhere.</span></div> </div> <div style="display:flex;align-items:baseline;gap:20px;padding-top:16px;border-top:1px solid #0B0B0B26"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B;flex:none">Why</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.035em;font-size:26px;line-height:1.15">A design system keeps design decisions intact <span style="font-style:italic">even when the people building it change.</span></span></div></div></section><section id="outcome" style="margin:110px 40px 0;padding:56px 48px;border-radius:28px;background:#FCEB3F;position:relative;overflow:hidden"> <svg width="900" height="300" viewBox="0 0 900 300" style="position:absolute;right:-140px;top:30px;pointer-events:none"><ellipse cx="450" cy="150" rx="440" ry="120" fill="none" stroke="#0B0B0B" stroke-width="1" transform="rotate(-6 450 150)"></ellipse></svg> <div style="position:relative;display:flex;flex-direction:column;gap:40px"> <div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">09</span><span>Outcome</span></div> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:48px;line-heig n></div><div style="padding:20px;border-radius:18px;background:#FFFFFF;display:flex;flex-direction:column;gap:22px;min-height:130px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">04</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:28px;line-height:1.02;margin-top:auto">When should it stop?</span></div> </div> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B;margin-bottom:-22px">What the product ended up with</span><div style="display:flex;flex-wrap:wrap;gap:8px"> <span style="display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:13.5px"><span style="width:20px;height:20px;border-radius:50%;background:#FCEB3F;color:#0B0B0B;display:grid;place-items:center;font-size:11px">✓</span>A clear AI role in each mode</span><span style="display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:13.5px"><span style="width:20px;height:20px;border-radius:50%;background:#FCEB3F;color:#0B0B0B;display:grid;place-items:center;font-size:11px">✓</span>Clear lines between private and shared</span><span style="display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:13.5px"><span style="width:20px;height:20px;border-radius:50%;background:#FCEB3F;color:#0B0B0B;display:grid;place-items:center;font-size:11px">✓</span>AI that responds to the moment</span><span style="display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:13.5px"><span style="width:20px;height:20px;border-radius:50%;background:#FCEB3F;color:#0B0B0B;disp
