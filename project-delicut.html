01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">06</span>27 states</a> <!-- --> <a class="dh7" href="#day" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">07</span>Day pattern</a> <!-- --> <a class="dh7" href="#patterns" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">08</span>Patterns</a> <!-- --> <a class="dh7" href="#expiry" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">09</span>Expiry</a> <!-- --> <a class="dh7" href="#learned" style="flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:transparent;color:#0B0B0B;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;transition:background .25s"><span style="font-size:10.5px;color:#E5322B">10</span>Learned</a> <!-- --> </div></nav><section id="tldr" style="padding:110px 40px 90px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"> <div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">00</span><span>TL;DR</span></div> <div style="display:flex;flex-direction:column;gap:48px"> <div style="display:flex;align-items:flex-end;gap:28px"> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.07em;font-size:180px;line-height:.78">15k+</span> <p style="margin:0 0 8px;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:36px;line-height:1.08;max-width:22ch">customers across the UAE, and the app only worked if they <span style="font-style:italic">followed their plan exactly.</span></p> </div> <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:12px"> <div style="padding:24px;border-radius:20px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">When I joined</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:28px;line-height:1.05">The service worked, but the app didn’t keep up</span><span style="font-size:14.5px;line-height:1.55;color:#3C3C38">Late joins, skipped meals, paused days and address changes had no clear screens.</span></div> <div style="padding:24px;border-radius:20px;background:#0B0B0B;color:#FFFFFF;display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">What I did</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:28px;line-height:1.05">Mapped 27 states <span style="font-style:italic">before designing screens</span></span><span style="font-size:14.5px;line-height:1.55;color:#FFFFFFb3">Then I designed web and mobile flows that change based on where the customer is in their plan.</span></div> <div style="padding:24px;border-radius:20px;background:#FCEB3F;display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase">The result</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:28px;line-height:1.05">An app built for <span style="font-style:italic">real customer habits</span></span><span style="font-size:14.5px;line-height:1.55">Customers could skip days and change meals on their own, without calling support.</span></div> </div> </div></section><section id="overview" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">01</span><span>Overview</span></div><div style="display:flex;flex-direction:column;gap:32px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:52px;line-height:1.02">Delicut delivers ready‑made meals with calories and macros counted. The product had <span style="font-style:italic">two jobs.</span></h2> <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch"> <div style="padding:28px;border-radius:24px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">Job 01 · Website</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:40px;line-height:.98">Help people pick a plan</span><span style="font-size:15px;line-height:1.5;color:#3C3C38">Help someone new to meal plans choose one based on their goals and food preferences.</span></div> <div style="display:grid;place-items:center;width:56px"><span style="width:44px;height:44px;border-radius:50%;background:#0B0B0B;color:#FCEB3F;display:grid;place-items:center">→</span></div> <div style="padding:28px;border-radius:24px;background:#0B0B0B;color:#FFFFFF;display:flex;flex-direction:column;gap:14px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">Job 02 · App, the harder part</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:40px;line-height:.98">Help them live with it <span style="font-style:italic">every day</span></span><span style="font-size:15px;line-height:1.5;color:#FFFFFFb3">Deliveries, meal swaps, skips and cut‑off times, all handled in the app.</span></div> </div></div></section><section id="problem" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">02</span><span>Problem</span></div><div style="display:flex;flex-direction:column;gap:32px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:48px;line-height:1.05;max-width:20ch">The plan was designed as a straight line. <span style="font-style:italic">Customers didn’t follow it.</span></h2> <div style="position:relative;display:flex;flex-direction:column"> <div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center"> <div style="display:flex;flex-direction:column;gap:10px"> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">A · What we designed for</span> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:34px;line-height:1">One straight path</span> <span style="font-size:14px;line-height:1.5;color:#3C3C38">Pick a plan, start, get meals, finish.</span> </div> <div style="position:relative;width:88%;height:240px;border-radius:18px;background:#FFFFFF url(&#x27;Mockups/Delicut/Delicut_Original.png&#x27;) center/contain no-repeat;background-origin:content-box;padding:18px 24px;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25)"> <span style="position:absolute;left:16px;top:-12px;padding:6px 11px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:12px;font-weight:600">Original</span> </div> </div> <div style="position:relative;height:120px"> <svg width="100%" height="120" viewBox="0 0 1000 120" preserveAspectRatio="none" style="position:absolute;inset:0;overflow:visible"> <path d="M 520 0 L 520 120" fill="none" stroke="#0B0B0B" stroke-width="1" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"></path> <path d="M 520 0 C 520 70, 760 40, 780 120" fill="none" stroke="#E5322B" stroke-width="2" vector-effect="non-scaling-stroke"></path> </svg> <span style="position:absolute;left:calc(52% - 210px);top:46px;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69">Expected path ↓</span> <span style="position:absolute;left:calc(66% + 8px);top:30px;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">What actually happened <!-- -->↘︎</span> </div> <div style="display:grid;grid-template-columns:200 .5px;line-height:1.45">What they’d expect to see after paying</span></div> <!-- --> <div style="padding:18px 0 0;border-top:1px solid #0B0B0B;display:flex;flex-direction:column;gap:8px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">04</span><span style="font-size:15.5px;line-height:1.45">Which parts should carry over into the app</span></div> <!-- --> </div> <div style="padding:26px 30px;border-radius:22px;background:#0B0B0B;color:#FFFFFF;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">Design<br/>decision</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:30px;line-height:1.12">The app should feel like the next step after buying, <span style="font-style:italic">not a separate product.</span></span></div></div></section><section id="onboarding" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">05</span><span>Onboarding</span></div><div style="display:grid;grid-template-columns:284px minmax(0,1fr);gap:40px;align-items:center"><div style="position:relative;width:284px;aspect-ratio:830 / 1686;flex:none;filter:drop-shadow(0 30px 34px rgba(0,0,0,.22))"><div style="position:absolute;left:3.3%;right:3.3%;top:1.3%;bottom:1.3%;border-radius:13% / 6.1%;overflow:hidden;background:#FFFFFF"><video src="Videos/Delicut/Onboarding-screen.mp4" autoPlay="" muted="" loop="" playsInline="" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block"></video></div><img src="Mockups/Delicut/iPhone%20Frame.webp" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none"/></div><div style="display:flex;flex-direction:column;gap:18px;min-width:0"><h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:32px;line-height:1.05">Setting up the app around the customer <span style="font-style:italic">without it feeling like a long form</span></h2><div style="border-radius:22px;overflow:hidden;background:#F9F4ED;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -36px rgba(0,0,0,.22)"><img src="Mockups/Delicut/Onboarding%20Elements.webp" alt="Onboarding screens: activity level, height, weight and goal pace" style="display:block;width:100%;height:auto"/></div><p style="margin:0;font-size:14.5px;line-height:1.5;color:#3C3C38">If the plan hasn’t started yet, customers don’t see an empty home screen. They see when the plan starts and when the first delivery arrives.</p><div style="padding:16px 20px;border-radius:18px;background:#0B0B0B;color:#FFFFFF;display:flex;flex-direction:column;gap:8px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F">Design decision</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:20px;line-height:1.15;letter-spacing:-.03em">The last onboarding screen tells customers <span style="font-style:italic">what happens next</span>, not just that setup is done.</span></div></div></div></section><section id="states" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">06</span><span>27 states</span></div><div style="display:flex;flex-direction:column;gap:24px"> <div style="display:flex;align-items:flex-end;gap:28px"> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.07em;font-size:120px;line-height:.78">27</span> <h2 style="margin:0 0 8px;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:34px;line-height:1.05;max-width:20ch">home and delivery states, mapped <span style="font-style:italic">before I designed a single screen</span></h2> </div> <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"> <span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#6E6E69;margin-right:6px">Based on</span> <span style="padding:10px 14px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:14px">Plan status</span><span style="padding:10px 14px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:14px">Selected date</span><span style="padding:10px 14px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:14px">Delivery status</span><span style="padding:10px 14px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:14px">Meal assignment</span><span style="padding:10px 14px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:14px">Cut‑off rules</span> </div> <div style="position:relative;height:370px;border-radius:20px;overflow:hidden;padding:24px 24px 0;box-sizing:border-box;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25)"><div role="img" aria-label="Table of home and delivery states" style="height:100%;background:url(&#x27;Mockups/Delicut/Delicut%20States%20Table.png&#x27;) top center/100% auto no-repeat"></div><div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.85) 60%, #FFFFFF 100%);pointer-events:none"></div></div></div></section><section id="day" style="margin:100px 40px 0;padding:48px;border-radius:28px;background:#0B0B0B;color:#FFFFFF"> <div style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"> <div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #FFFFFF;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#FCEB3F">07</span><span>Day pattern</span></div> <div style="display:flex;flex-direction:column;gap:32px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:52px;line-height:1">The same meal card shows <span style="font-style:italic">different actions</span> depending on the day</h2> <div style="display:grid;grid-template-columns:232px minmax(0,1fr);gap:56px;align-items:start"> <div style="position:sticky;top:170px;width:232px;aspect-ratio:830 / 1686;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))"><div style="position:absolute;left:3.3%;right:3.3%;top:1.3%;bottom:1.3%;border-radius:13% / 6.1%;overflow:hidden;background:#FFFFFF"><video src="Videos/Delicut/2New-screen.mp4" muted="" playsInline="" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:1;transition:opacity .5s"></video><video src="Videos/Delicut/4New-screen.mp4" muted="" playsInline="" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s"></video><video src="Videos/Delicut/3New-screen.mp4" muted="" playsInline="" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s"></video></div><img src="Mockups/Delicut/iPhone%20Frame.webp" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none"/></div> <div style="display:flex;flex-direction:column"> <div data-dlstep="0" style="min-height:440px;display:flex;flex-direction:column;justify-content:center;gap:20px;opacity:1;transition:opacity .45s"> <div style="display:flex;gap:8px;align-items:center"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F;margin-right:4px">01</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FFFFFF1A">Locked</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FCEB3F;color:#0B0B0B">View only</span></div> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.06em">Today</span> <p style="margin:0;font-size:17px;line-height:1.55;color:#FFFFFFcc;max-width:46ch">Today’s delivery is locked. Customers can see their meals and delivery details but can’t change them, and the screen makes that clear without looking broken.</p> <div style="display:flex;flex-wrap:wrap;gap:8px"><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">See meals</span><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Delivery details</span></div> </div><div data-dlstep="1" style="min-height:440px;display:flex;flex-direction:column;justify-content:center;gap:20px;opacity:0.3;transition:opacity .45s"> <div style="display:flex;gap:8px;align-items:center"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F;margin-right:4px">02</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FFFFFF1A">Past</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FCEB3F;color:#0B0B0B">Rate meal</span></div> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.06em">Yesterday</span> <p style="margin:0;font-size:17px;line-height:1.55;color:#FFFFFFcc;max-width:46ch">For past days, delivery options are replaced with rating. If the delivery was skipped, there’s nothing to rate, so rating is hidden.</p> <div style="display:flex;flex-wrap:wrap;gap:8px"><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Rate meals</span><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Check delivery</span></div> </div><div data-dlstep="2" style="min-height:440px;display:flex;flex-direction:column;justify-content:center;gap:20px;opacity:0.3;transition:opacity .45s"> <div style="display:flex;gap:8px;align-items:center"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#FCEB3F;margin-right:4px">03</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FFFFFF1A">Open</span><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:#FCEB3F;color:#0B0B0B">Manage delivery</span></div> <span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.06em">Tomorrow</span> <p style="margin:0;font-size:17px;line-height:1.55;color:#FFFFFFcc;max-width:46ch">Before the cut‑off time, future days have the most actions. The goal was to make them easy to find without crowding the card.</p> <div style="display:flex;flex-wrap:wrap;gap:8px"><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Change meal</span><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Skip delivery</span><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Resume delivery</span><span style="padding:10px 14px;border-radius:999px;border:1px solid #FFFFFF33;font-size:14px">Change address</span></div> </div> </div> </div> <div style="padding:22px 26px;border-radius:20px;background:#FCEB3F;color:#0B0B0B;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase">Design<br/>decision</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.04em;font-size:28px;line-height:1.12">The meal details stay the same. <span style="font-style:italic">Only the actions change with the day.</span></span></div> </div> </div></section><section id="patterns" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">08</span><span>Key UX patterns</span></div><div style="display:flex;flex-direction:column;gap:24px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:44px;line-height:1.05">Two small patterns that stop customers from <span style="font-style:italic">hitting a dead end</span></h2> <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"> <!-- --> <div style="height:452px;border-radius:24px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr)"> <div style="padding:16px;background:#EFEFEC;display:flex;align-items:center;justify-content:center;overflow:hidden"><img class="dha" src="Mockups/Delicut/Pattern%20Skip%20Resume.webp" alt="Skip and resume" style="display:block;height:420px;width:auto;max-width:none;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22));transform:scale(1);transition:transform .6s cubic-bezier(.3,.9,.3,1)"/></div> <div style="padding:26px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">Pattern 01</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:30px;line-height:1;letter-spacing:-.04em">Skip and resume</span></div><span style="font-size:14.5px;line-height:1.55;color:#3C3C38">One calendar shows active and skipped days at a glance. Customers pause specific dates, not the whole plan.</span></div> </div> <!-- --> <div style="height:452px;border-radius:24px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 30px 60px -32px rgba(0,0,0,.25);overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr)"> <div style="padding:16px;background:#EFEFEC;display:flex;align-items:center;justify-content:center;overflow:hidden"><img class="dha" src="Mockups/Delicut/Pattern%20Cut-off%20Drawer.webp" alt="Cut‑off drawer" style="display:block;height:420px;width:auto;max-width:none;filter:drop-shadow(0 18px 22px rgba(0,0,0,.22));transform:scale(1);transition:transform .6s cubic-bezier(.3,.9,.3,1)"/></div> <div style="padding:26px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:12px"><span style="font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:#E5322B">Pattern 02</span><span style="font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;font-size:30px;line-height:1;letter-spacing:-.04em">Cut‑off drawer</span></div><span style="font-size:14.5px;line-height:1.55;color:#3C3C38">When a delivery can’t be changed, a bottom sheet explains why and shows the cut‑off time that passed. Customers are never left tapping a locked day with no response.</span></div> </div> <!-- --> </div></div></section><section id="expiry" style="padding:100px 40px 40px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px"><div style="display:flex;align-items:baseline;gap:14px;padding-top:10px;border-top:1px solid #0B0B0B;font-family:&#x27;Geist&#x27;,sans-serif;font-weight:500;font-size:10.5px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase"><span style="color:#E5322B">09</span><span>Expiry</span></div><div style="display:flex;flex-direction:column;gap:16px"> <h2 style="margin:0;font-family:&#x27;Funnel Sans&#x27;,sans-serif;font-weight:400;letter-spacing:-.055em;font-size:44px;line-height:1">Ending a plan took <span style="font-style:italic">four stages,</span> not one screen</h2> <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;padding:6px;border-radius:22px;background:#E2E2DE"> <!-- --> <button type="button"
